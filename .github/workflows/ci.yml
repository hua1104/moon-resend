name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        run: moon update

      - name: Check
        run: moon check

      - name: Test wasm
        run: moon test

      - name: Coverage audit
        run: moon coverage analyze

      - name: Test native adapter
        run: moon test --target native

      - name: Build live example
        run: moon build cmd/send-live --target native

      - name: Verify formatting
        run: |
          moon fmt
          git diff --exit-code
